[theme]
base = "light"
font = "Inter, sans-serif"
headingFont = "Hanken Grotesk, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseRadius = "medium"
buttonRadius = "medium"
showSidebarBorder = true

[theme.light]
primaryColor = "#1e3a8a"
backgroundColor = "#f8f9ff"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b1c30"
borderColor = "#dce3ee"
dataframeBorderColor = "#dce3ee"
dataframeHeaderBackgroundColor = "#eff4ff"
codeTextColor = "#173b73"
codeBackgroundColor = "#eff4ff"
blueColor = "#2563eb"
blueBackgroundColor = "#eff6ff"
blueTextColor = "#1d4ed8"
greenColor = "#059669"
greenBackgroundColor = "#ecfdf5"
greenTextColor = "#047857"
orangeColor = "#d97706"
orangeBackgroundColor = "#fffbeb"
orangeTextColor = "#b45309"
redColor = "#e11d48"
redBackgroundColor = "#fff1f2"
redTextColor = "#be123c"
grayColor = "#64748b"
grayBackgroundColor = "#f1f5f9"
grayTextColor = "#475569"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9ff"
textColor = "#0b1c30"
primaryColor = "#1e3a8a"
borderColor = "#dce3ee"

[theme.dark]
primaryColor = "#2458b8"
