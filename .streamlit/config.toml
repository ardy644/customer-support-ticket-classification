orangeTextColor = "#ffd28a"
redColor = "#ff6b86"
redBackgroundColor = "#3d202b"
redTextColor = "#ffb2c0"
grayColor = "#9aa9bf"
grayBackgroundColor = "#263247"
grayTextColor = "#b9c5d6"

[theme.dark.sidebar]
backgroundColor = "#0a1020"
secondaryBackgroundColor = "#121c2d"
